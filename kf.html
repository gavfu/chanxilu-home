<style>
  :root {
    color-scheme: light dark;
    --paper: #FAFAFA;
    --ink: #1F1F1F;
    --ink2: #5C5C5C;
    --ink3: #717171;
    --brand: #E31837;
    --brand-hov: #CC1531;
    --brand-press: #B8122C;
    --button-edge: var(--brand-press);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #111111;
      --ink: #E8E8E8;
      --ink2: #AEAEAE;
      --ink3: #8C8C8C;
      --button-edge: var(--ink2);
    }
  }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    line-height: 1.75;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 48px 24px 80px; }
  h1 { font-size: 26px; margin: 0 0 8px; }
  h2 { font-size: 18px; margin: 32px 0 4px; }
  p { margin: 0; font-size: 14px; }
  .intro { color: var(--ink2); font-size: 16px; margin-bottom: 24px; }
  a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
  a:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .cta {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    min-height: 48px;
    max-width: 100%;
    padding: 8px 22px;
    border: 1px solid var(--button-edge);
    border-radius: 9999px;
    background: var(--brand);
    color: white;
    font-weight: 600;
    text-decoration: none;
  }
  .cta:hover { background: var(--brand-hov); }
  .cta:active { background: var(--brand-press); }
  .hint, figcaption { margin-top: 8px; font-size: 13px; color: var(--ink3); }
  figure { margin: 24px 0 0; }
  figure svg { display: block; max-width: 100%; height: auto; }
  footer { margin-top: 24px; color: var(--ink2); }
</style>
</head>
